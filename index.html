<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Gemini AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Google Gemini</h1>
        <p>AI-Powered Assistant</p>
      </div>
      <button id="clearBtn" class="secondary">Clear</button>
    </header>

    <main id="chat" class="chat">
      <div class="message bot">
        <strong>Gemini</strong>
        <p>Hello! I am your AI assistant. Ask me anything.</p>
      </div>
    </main>

    <form id="chatForm" class="composer">
      <textarea id="messageInput" placeholder="Type your message..." rows="2" required></textarea>
      <button id="sendBtn" type="submit">Send</button>
    </form>
    <p class="note">Powered by Google Gemini API</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
